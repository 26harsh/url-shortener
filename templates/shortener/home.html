<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URL Shortener</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 560px; margin: 80px auto; color: #1a1a1a; }
        h1 { font-size: 1.4rem; }
        form { display: flex; gap: 8px; margin-top: 24px; }
        input[type=url] { flex: 1; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        button { padding: 10px 18px; border: none; border-radius: 6px; background: #1a1a1a; color: white; cursor: pointer; }
        .result { margin-top: 20px; padding: 14px; background: #f4f4f4; border-radius: 6px; word-break: break-all; }
        .error { margin-top: 20px; color: #b00020; }
    </style>
</head>
<body>
    <h1>URL Shortener</h1>
    <p>Django + Postgres + Redis, cache-aside strategy on the redirect path.</p>

    <form method="post">
        {% csrf_token %}
        <input type="url" name="long_url" placeholder="https://example.com/very/long/path" required>
        <button type="submit">Shorten</button>
    </form>

    {% if short_url %}
        <div class="result">
            <strong>Short URL:</strong>
            <a href="{{ short_url }}">{{ short_url }}</a>
        </div>
    {% endif %}

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
</body>
</html>
